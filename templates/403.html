{% extends "base.html" %}
{% block meta %}
    <title>403 Forbidden - Akses Ditolak</title>
{% endblock meta %}
{% block content %}
<main>
    <section class="experience-section">
        <div class="container" style="text-align: center; max-width: 600px; margin: 3rem auto;">
            <div style="background: white; border: 1px solid var(--line); border-radius: 12px; padding: 2.5rem 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <p style="font-size: 3rem; margin-bottom: 0.5rem;" aria-hidden="true">🚫</p>
                <h1 style="font-size: 2rem; margin-bottom: 0.75rem; color: #b42318;">403 - Akses Ditolak</h1>
                <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem;">
                    Anda tidak memiliki izin (hak akses) untuk melakukan tindakan ini.
                </p>
                <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
                    <a href="{% url 'main:show_main' %}" class="button">Kembali ke Profil</a>
                    <a href="{% url 'main:show_experience' %}" class="button button-secondary">Lihat Experience</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
